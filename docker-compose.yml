services:
  # 1. Eclipse Mosquitto
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot_mosquitto
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot_network

  # 2. RabbitMQ
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: iot_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      
  # 3. PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iot_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iot_network
      
  api:
    build:
      context: ./IotPipeline.Platform
      dockerfile: Dockerfile
    container_name: iot_telemetry_api
    networks:
      - iot_network
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - MqttSettings__Host=mosquitto
      - MqttSettings__Port=1883
      - MqttSettings__Topic=factory/telemetry/#
      - RabbitMQSettings__Host=rabbitmq
      - RabbitMQSettings__Port=5672
      - RabbitMQSettings__Username=${RABBITMQ_USER}
      - RabbitMQSettings__Password=${RABBITMQ_PASS}
      - GeminiSettings__ApiKey=${GEMINI_API_KEY}
      - OTEL__ServiceName=${OTEL_PLATFORM_SERVICENAME}
      - OTEL__Endpoint=${OTEL_TEMPO_ENDPOINT}
      - ASPNETCORE_ENVIRONMENT=Production
      - Serilog__WriteTo__1__Args__uri=${OTEL_LOKI_ENDPOINT}
      
  web-ui:
    build:
      context: ./UI/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SIGNALR_HUB_URL=http://localhost:8000/analytics-hub
    container_name: iot_telemetry_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
        
  sensor:
    build:
      context: ./IotPipeline.VirtualSensor
      dockerfile: Dockerfile
    container_name: iot_telemetry_sensor
    networks:
      - iot_network
    depends_on:
      - mosquitto
    environment:
      - MqttSettings__Host=mosquitto
      - MqttSettings__Port=1883
      - MqttSettings__PublishIntervalMs=2000
      - MqttSettings__TopicPrefix=factory/telemetry
      - OTEL__ServiceName=${OTEL_SENSOR_SERVICENAME}
      - OTEL__Endpoint=${OTEL_TEMPO_ENDPOINT}
    
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: iot_lgtm
    networks:
      - iot_network
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      
volumes:
  postgres_data:
  grafana_data:
  
networks:
  iot_network:
    driver: bridge